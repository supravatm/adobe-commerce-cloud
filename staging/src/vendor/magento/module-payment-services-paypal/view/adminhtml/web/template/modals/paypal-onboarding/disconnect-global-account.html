<div class="paypal-onboarding-modal-disconnect-global-account admin__page-section">
    <h4 data-bind="i18n: 'Disconnect from the currently connected account?'"></h4>

    <p data-bind="i18n: 'If you continue, this website will be disconnected from its current account and all future payments for this website will use the new payment account instead.'"></p>
    <p data-bind="i18n: 'This change only affects this website.'"></p>

    <div class="paypal-onboarding-modal-disconnect-global-account-actions">
        <button class="button action secondary" data-bind="
                    click: cancel,
                    i18n: 'Cancel'"></button>
        <button class="button action primary" data-bind="
                    click: confirmAndConnectNewAccount,
                    i18n: 'Confirm and connect new account'"></button>
    </div>
</div>
