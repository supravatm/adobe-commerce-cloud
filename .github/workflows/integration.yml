name: Integration Deployment

on:
  push:
    branches:
      - integration

jobs:
  deploy:
    name: Deploy Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Integration Docker
        working-directory: integration/src
        run: docker compose up -d
        
      - name: Show Docker services
        working-directory: integration/src
        run: docker compose ps

      - name: Show environment
        run: |
          echo "Environment: Integration"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"

      - name: Validate deployment scripts
        run: |
          test -x deployment/build.sh || chmod +x deployment/build.sh
          test -x deployment/deploy.sh || chmod +x deployment/deploy.sh
          test -x deployment/post-deploy.sh || chmod +x deployment/post-deploy.sh

      - name: Build
        run: |
          ./deployment/build.sh integration

      - name: Deploy
        run: |
          ./deployment/deploy.sh integration

      - name: Post deployment validation
        run: |
          ./deployment/post-deploy.sh integration