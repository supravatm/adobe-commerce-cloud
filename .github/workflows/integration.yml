name: Integration Deployment

on:
  pull_request:
    branches:
      - integration

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, bcmath, soap, zip, pdo_mysql
          tools: composer

      - name: Validate Composer files
        working-directory: integration/src
        run: |
          composer validate --no-check-publish

      - name: Install Composer dependencies
        working-directory: integration/src
        run: |
          composer install \
            --no-interaction \
            --no-progress \
            --prefer-dist

      - name: Validate PHP syntax
        working-directory: integration/src
        run: |
          find app/code -type f -name "*.php" -print0 | \
            xargs -0 -n1 php -l

      - name: Run Magento coding standard
        working-directory: integration/src
        run: |
          if [ -x vendor/bin/phpcs ]; then
            vendor/bin/phpcs app/code
          else
            echo "PHP_CodeSniffer is not installed. Skipping."
          fi

      - name: Run PHPStan
        working-directory: integration/src
        run: |
          if [ -x vendor/bin/phpstan ]; then
            vendor/bin/phpstan analyse app/code --no-progress
          else
            echo "PHPStan is not installed. Skipping."
          fi

      - name: Run unit tests
        working-directory: integration/src
        run: |
          if [ -x vendor/bin/phpunit ]; then
            vendor/bin/phpunit
          else
            echo "PHPUnit is not installed. Skipping."
          fi

      - name: Validation complete
        run: echo "Magento validation completed successfully."