name: Integration Deployment

on:
  push:
    branches:
      - integration

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Magento directories
        working-directory: integration
        run: |
          echo "Current directory:"
          pwd

          echo "Magento directories:"
          ls -ld src
          ls -ld src/app
          ls -ld src/app/design || true
          ls -ld src/dev/tools/grunt/configs || true
          ls -ld src/generated || true
          ls -ld src/var || true

          echo "Git tracked files:"
          git ls-files src/app/design src/dev/tools/grunt/configs src/generated src/var
      - name: Generate Docker versions
        working-directory: integration
        run: ./bin/detect-versions magento 2.4.9

      - name: Start Magento
        working-directory: integration
        run: ./bin/start

      - name: Start Magento
        working-directory: integration
        run: ./bin/start

      - name: Check Magento containers
        working-directory: integration
        run: ./bin/status

      - name: Install Composer dependencies
        working-directory: integration
        run: ./bin/composer install --no-interaction

      - name: Compile Magento
        working-directory: integration
        run: ./bin/magento setup:di:compile

      - name: Enable maintenance mode
        working-directory: integration
        run: ./bin/magento maintenance:enable

      - name: Deploy Magento
        working-directory: integration
        run: |
          ./bin/magento setup:upgrade
          ./bin/magento cache:flush
          ./bin/magento indexer:reindex

      - name: Disable maintenance mode
        working-directory: integration
        run: ./bin/magento maintenance:disable

      - name: Post deployment cache warmup
        working-directory: integration
        run: |
          ./bin/magento cache:flush

          BASE_URL=$(./bin/magento config:show web/unsecure/base_url)

          echo "Warming cache: $BASE_URL"

          curl -fsS "$BASE_URL" > /dev/null

      - name: Deployment complete
        run: echo "Integration deployment completed successfully"